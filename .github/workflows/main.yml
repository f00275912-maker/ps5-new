name: PS5 bot

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ps5-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Zoek naar deals
        env:
          GMAIL_ADRES: ${{ secrets.GMAIL_ADRES }}
          GMAIL_APP_WACHTWOORD: ${{ secrets.GMAIL_APP_WACHTWOORD }}
        run: python ps5_bot.py --once

      - name: Bewaar lijst met geziene advertenties
        run: |
          git config user.name "ps5-bot"
          git config user.email "ps5-bot@users.noreply.github.com"
          git add gezien.json
          git diff --cached --quiet || (git commit -m "update gezien" && git push)
